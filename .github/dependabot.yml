#
# Grouped weekly update PRs: dependency drift arrives as one reviewable change per
# ecosystem, not a trickle.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Supply-chain cooldown: a release is proposed only once it has been public
    # for a week, the window in which a compromised publish is usually found
    # and yanked. Security updates are not delayed by this.
    cooldown:
      default-days: 7
    groups:
      # Routine drift: one reviewable PR, expected to be mergeable on green CI.
      cargo-dependencies:
        patterns: ["*"]
        # rmcp is not routine. An rmcp bump is a deliberate upgrade that must be
        # re-validated against the official suite, and grouping it here made the whole PR
        # unmergeable: #28 bundled rmcp 1.7 -> 2.2 (~70 compile errors) with six
        # harmless bumps, so the six were held hostage by the one. `rmcp-macros`
        # rides along because it is version-locked to rmcp (register 3.13).
        exclude-patterns: ["rmcp", "rmcp-macros"]
      # Its own PR, so the SDK upgrade is *visible* rather than hidden — it is
      # the input to milestone M2.5, not noise to be ignored.
      rmcp-sdk:
        patterns: ["rmcp", "rmcp-macros"]
    ignore:
      # The reference host names `sse_stream::Sse` in rmcp's own
      # `StreamableHttpClient` signature, so it must use the sse-stream version
      # rmcp uses. rmcp 3.4.1 requires `0.2.4`; a 0.3 bump cannot compile (#55,
      # E0308). Lift this when rmcp moves to 0.3.
      - dependency-name: "sse-stream"
        versions: [">=0.3"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Cooldown: as for the workspace cargo entry.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # The fuzz harness is its own workspace with its own Cargo.lock (fuzz/Cargo.toml
  # explains why), so the root entry above never sees it.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    # Cooldown: as for the workspace cargo entry.
    cooldown:
      default-days: 7
    groups:
      fuzz:
        patterns: ["*"]
  # The interop check's pinned official SDKs (interop/, ci.yml `interop`).
  - package-ecosystem: npm
    directory: /interop
    schedule:
      interval: weekly
    # Cooldown: as for the workspace cargo entry.
    cooldown:
      default-days: 7
    groups:
      interop-npm:
        patterns: ["*"]
    ignore:
      # Deliberately old: an npm alias of the TypeScript SDK at 1.13.0, kept to
      # produce a 2025-06-18 session that the validator must refuse (run.sh,
      # step 5). Bumping it would remove the session the check exists for.
      # If Dependabot keys the alias by its target package instead, a bump
      # arrives inside the SDK group and the interop job fails on step 5 — a
      # visible failure, not a silent one.
      - dependency-name: "sdk-2025-06-18"
  # requirements.txt is a `uv pip compile --generate-hashes` lock of
  # requirements.in. The `uv` ecosystem (not `pip`) is the one that recompiles
  # such files: it reads the header's `uv pip compile` command, keeps
  # `--generate-hashes` when the lock carries hashes and honours
  # `--python-version` (dependabot-core uv/lib/dependabot/uv/file_updater/
  # compile_file_updater.rb), so the hashes are regenerated, not left stale.
  # The recompile rewrites the file's header, which is why the SPDX gate
  # exempts this generated lock as it does Cargo.lock.
  - package-ecosystem: uv
    directory: /interop
    schedule:
      interval: weekly
    # Cooldown: as for the workspace cargo entry.
    cooldown:
      default-days: 7
    groups:
      interop-python:
        patterns: ["*"]
