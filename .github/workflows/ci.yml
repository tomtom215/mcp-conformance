# Copyright 2026 Tom F. (https://github.com/tomtom215)
#
# Continuous integration — every quality gate from docs/plan/04-engineering-standards.md.
#
# Jobs: format, clippy (stable + MSRV × 3 OS × 3 feature modes), test (same matrix),
#       docs (-D warnings), cargo-deny, package validation, nightly (informational).
#
# Toolchains are installed with plain `rustup` rather than a third-party action:
# one fewer supply-chain dependency. Remaining actions are pinned by commit SHA.

name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Cancel superseded runs on branches/PRs; never cancel main-branch builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Every JavaScript action pinned here already declares `node24` (verified
  # 2026-07-26 at the pinned SHAs: actions/checkout v7.0.1 and Swatinem/rust-cache;
  # actions/attest-build-provenance is composite), so this is no longer the
  # load-bearing opt-in it was when checkout sat at v6.0.3 — it stays as a guard
  # so a future pin that predates the June 16, 2026 runner cutover cannot
  # silently run on the old runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The first entry must equal rust-toolchain.toml's channel; the second is
        # the MSRV (ADR-0008). `cargo xtask toolchain-pin` fails when the two
        # files disagree — the `matrix` context cannot read `env`, so the version
        # is written out here and checked rather than interpolated.
        rust: ["1.98.1", "1.88"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    # A directory override outranks `rustup default`, so naming the toolchain in
    # the environment is the only way a leg can override rust-toolchain.toml.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        # bash on every OS: Windows' default shell, PowerShell, reads
        # "$RUSTUP_TOOLCHAIN" as an (empty) PowerShell variable.
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same pair as the clippy matrix, and gated the same way.
        rust: ["1.98.1", "1.88"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        # bash on every OS, for the reason given in the clippy job.
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (no default features)
        run: cargo test --workspace --no-default-features
      - name: Test (all features)
        run: cargo test --workspace --all-features

  # SARIF output against the OASIS SARIF 2.1.0 schema. The schema is fetched,
  # not committed (its licence is the OASIS IPR policy, not an open-source one),
  # from the URL the standard names as its own `id`, and pinned by SHA-256 so a
  # changed file fails loudly instead of silently moving the target.
  sarif-schema:
    name: SARIF output valid under the OASIS schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch the SARIF 2.1.0 schema (pinned by hash)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/sarif-schema-2.1.0.json" \
            https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json
          echo "c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e  $RUNNER_TEMP/sarif-schema-2.1.0.json" | sha256sum --check
      - name: Every violation trace's SARIF log is valid
        run: SARIF_SCHEMA="$RUNNER_TEMP/sarif-schema-2.1.0.json" cargo test -p mcp-trace-validator --test sarif -- --ignored

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build docs (zero warnings)
        run: cargo doc --workspace --no-deps
      # Feature-gated modules (the everything-server's `tap`) carry rustdoc the
      # default-feature build never sees; a broken intra-doc link there is only
      # caught with --all-features.
      - name: Build docs with all features (zero warnings)
        run: cargo doc --workspace --no-deps --all-features
      # One command, and the list of gates lives in `xtask`, not here. Four of
      # them used to be written out in this job while `changelog-links` and
      # `draft-coverage --check` ran only inside `cargo xtask ci` — which no
      # push or pull-request workflow invokes — so the gate that stops published
      # numbers from drifting did not run on the change that published them.
      - name: Offline gates (sizes, fuzz targets, links, versions, coverage projections)
        run: cargo xtask gates

  book:
    name: Book (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install mdBook
        # Built from source under --locked rather than via a third-party setup
        # action: one fewer supply-chain dependency, the same discipline as the
        # plain-rustup toolchain installs. rust-cache restores the prior build.
        run: cargo install mdbook --locked --version 0.5.3
      - name: Build the book (a missing include file or anchor fails here)
        run: mdbook build book
      - name: Upload the rendered book
        # The deployable artifact. "Live" GitHub Pages deployment is a separate,
        # owner-gated step (repository Pages settings); this job proves the book
        # builds on every push and publishes the bytes a deploy would serve.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book
          path: book/book
          if-no-files-found: error
          retention-days: 30

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the release tag's commit (not the floating `v2` tag's
      # annotated-tag object, which the 2026-06-11 audit found this line
      # carrying: such an object survives only as an unreferenced blob in
      # upstream's object store once `v2` moves again — resolvable today,
      # GC bait tomorrow, and invisible to dependabot).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  package:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--workspace` resolves path+version deps against sibling crates rather than
      # crates.io, which is what pre-publish validation needs. xtask is publish=false
      # but `cargo package --workspace` still packages it (v0.1.0 shipped a stray
      # xtask .crate before release.yml learned this) — exclude it here for the same
      # reason, so this job validates exactly what a release would package.
      - name: Package all publishable crates
        run: cargo package --workspace --exclude xtask --locked

  nightly:
    name: Nightly (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        # `RUSTUP_TOOLCHAIN` below, not `rustup default`: rust-toolchain.toml is
        # a directory override and outranks the default, so a job that wants a
        # different toolchain has to say so in the environment.
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test (all features, nightly)
        run: cargo test --workspace --all-features

  # Proves the `>=` floors in workspace dependency ranges are real: resolve every
  # dependency to its minimum allowed version (nightly resolver flag), then build and
  # test on stable against that lockfile. Informational like the nightly job — a red
  # run means a floor needs raising, not that the tree is broken.
  minimal-versions:
    name: Minimal versions (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchains
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          # The non-nightly half of this job runs on the pinned toolchain, which
          # rust-toolchain.toml installs; `cargo +nightly` overrides it where the
          # unstable flag is needed.
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Resolve minimal versions
        run: cargo +nightly generate-lockfile -Zminimal-versions
      - name: Test against minimum dependency versions
        run: cargo test --workspace --all-features --locked

  # The M2+M3 hard gate: the pinned official suite's server scenarios against
  # the everything server over streamable HTTP, then the client leg — the
  # reference host as the suite's client SUT (four protocol scenarios,
  # sequential so the sse-retry clock is never under parallel load), a
  # child-process stdio smoke between the two real binaries, and the
  # agreement replay on both sides (cargo xtask conformance documents the
  # steps and the version pin). This job is the one deliberate exception
  # to "no network beyond the package registries": npx fetches the pinned
  # runner from npm, and the runner dials loopback in both directions. Tests
  # (`cargo test` anywhere in the workspace) still never touch a network.
  conformance:
    name: Conformance (official suite, server + client scenarios)
    # ubuntu-only by decision (third audit, 2026-06-13): the npx-gated legs
    # buy platform coverage of the *runner*, which upstream itself runs on
    # Linux. Our platform-variant surface — the tap and capture serialization
    # the validator consumes — is covered on every OS by the test-matrix
    # round-trips (tap_output_parses_and_validates_through_the_real_validator
    # and the host capture tests), so two more npx jobs would re-run Node to
    # re-prove Rust code already proven cross-platform.
    runs-on: ubuntu-latest
    # A warm run takes ~2 minutes; the bound exists because this is the one
    # job whose tools (npx, the runner) can hang on network state, and a
    # wedged job should fail in minutes, not at the 6-hour runner cap.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Runner prerequisites (Node is preinstalled on the runner image)
        run: node --version && npx --version
      - name: Official suite vs everything-server
        run: cargo xtask conformance
      - name: Upload scenario verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-verdicts
          path: target/conformance/
          if-no-files-found: warn
          retention-days: 30

  # Independent traffic: the official TypeScript and Python SDKs talk to each
  # other (TS client -> TS everything server at 2025-11-25, Python client ->
  # Python server at 2026-07-28, each over stdio and streamable HTTP), recorded
  # through mcp-trace-capture and judged by mcp-trace-validator. Every session
  # must judge `pass` at the revision its SDK speaks, and a 2025-06-18 session
  # from an older SDK must be refused with exit 2. SDK versions are pinned by
  # interop/package-lock.json and the hash-locked interop/requirements.txt.
  interop:
    name: Interop (official TypeScript and Python SDKs through capture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the recorder and the validator
        run: cargo build --locked -p mcp-trace-capture -p mcp-trace-validator
      - name: Install the pinned SDKs (Node and Python are preinstalled on the runner image)
        working-directory: interop
        run: |
          node --version && python3 --version
          npm ci --no-audit --no-fund
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r requirements.txt
      - name: Record and judge five sessions
        working-directory: interop
        run: PYTHON="$PWD/.venv/bin/python" ./run.sh ../target/debug
      - name: Upload traces and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interop-traces
          path: interop/out/
          if-no-files-found: warn
          retention-days: 30

  # The workflows themselves, linted: actionlint (expression and type checks,
  # shellcheck over every `run:` script) and zizmor (GitHub Actions security
  # audits: injection, credential persistence, cache poisoning, unpinned uses,
  # excessive permissions, Dependabot cooldown). Both tools are fetched at an
  # exact version and verified by hash before they run, the same rule the
  # actions themselves follow. A finding a change cannot fix is suppressed
  # inline, beside its stated reason (`# zizmor: ignore[...]`,
  # .github/actionlint.yaml) — never by lowering the persona.
  #
  # zizmor runs --offline: its online audits (impostor commits, tag/SHA
  # mismatches) need API access this job does not request. The pins were
  # checked against upstream tags by hand on 2026-10-04; Dependabot keeps
  # them current.
  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: "1.30.1"
      # zizmor-1.30.1-py3-none-manylinux_2_28_x86_64.whl, from PyPI's JSON API.
      ZIZMOR_SHA256: eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (release tarball, SHA-256 checked)
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" "$url"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (with shellcheck)
        run: |
          set -euo pipefail
          # The runner image ships ShellCheck; actionlint silently skips
          # script checks without it, so its absence is an error here.
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color
      - name: Install zizmor (exact version, hash-locked wheel)
        run: |
          set -euo pipefail
          printf 'zizmor==%s --hash=sha256:%s\n' "$ZIZMOR_VERSION" "$ZIZMOR_SHA256" > "$RUNNER_TEMP/zizmor-requirements.txt"
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary=:all: --no-deps \
            -r "$RUNNER_TEMP/zizmor-requirements.txt"
      - name: zizmor (workflows and dependabot.yml)
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --offline --format=github .github/'
