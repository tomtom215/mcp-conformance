# SPDX-License-Identifier: MIT
# Copyright 2026 Tom F. (https://github.com/tomtom215)
#
# Continuous integration — every quality gate from docs/plan/04-engineering-standards.md.
#
# Jobs: format, clippy (stable + MSRV × 3 OS × 3 feature modes), test (same matrix),
#       docs (-D warnings), cargo-deny, package validation (with an SBOM dry run),
#       semver (vs crates.io), coverage (95% line floor), nightly (informational),
#       visual (the HTML report's screenshot baselines, no network on open).
#
# Toolchains are installed with plain `rustup` rather than a third-party action:
# one fewer supply-chain dependency. Remaining actions are pinned by commit SHA.

name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Cancel superseded runs on branches/PRs; never cancel main-branch builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Every JavaScript action pinned here already declares `node24` (verified
  # 2026-07-26 at the pinned SHAs: actions/checkout v7.0.1 and Swatinem/rust-cache;
  # actions/attest-build-provenance is composite), so this is no longer the
  # load-bearing opt-in it was when checkout sat at v6.0.3 — it stays as a guard
  # so a future pin that predates the June 16, 2026 runner cutover cannot
  # silently run on the old runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The first entry must equal rust-toolchain.toml's channel; the second is
        # the MSRV (ADR-0008). `cargo xtask toolchain-pin` fails when the two
        # files disagree — the `matrix` context cannot read `env`, so the version
        # is written out here and checked rather than interpolated.
        rust: ["1.99.0", "1.88"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    # A directory override outranks `rustup default`, so naming the toolchain in
    # the environment is the only way a leg can override rust-toolchain.toml.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        # bash on every OS: Windows' default shell, PowerShell, reads
        # "$RUSTUP_TOOLCHAIN" as an (empty) PowerShell variable.
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The clippy legs build each crate with no, default and all features. A
  # feature on its own (the host's `http` without `proc`, the capture tool's
  # `cli` without `tls`) is built nowhere else, and inside the workspace a
  # sibling's features unify into it and hide a missing gate. `--no-dev-deps`
  # keeps dev-dependencies from unifying features back in.
  features:
    name: Each feature alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-hack
        run: cargo install cargo-hack --version 0.6.45 --locked
      - name: Check every crate with each feature on its own
        run: cargo hack check --workspace --exclude xtask --each-feature --no-dev-deps

  test:
    name: Test (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same pair as the clippy matrix, and gated the same way.
        rust: ["1.99.0", "1.88"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        # bash on every OS, for the reason given in the clippy job.
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (no default features)
        run: cargo test --workspace --no-default-features
      - name: Test (all features)
        run: cargo test --workspace --all-features

  # SARIF output against the OASIS SARIF 2.1.0 schema. The schema is fetched,
  # not committed (its licence is the OASIS IPR policy, not an open-source one),
  # from the URL the standard names as its own `id`, and pinned by SHA-256 so a
  # changed file fails loudly instead of silently moving the target.
  sarif-schema:
    name: SARIF output valid under the OASIS schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch the SARIF 2.1.0 schema (pinned by hash)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/sarif-schema-2.1.0.json" \
            https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json
          echo "c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e  $RUNNER_TEMP/sarif-schema-2.1.0.json" | sha256sum --check
      - name: Every violation trace's SARIF log is valid
        run: SARIF_SCHEMA="$RUNNER_TEMP/sarif-schema-2.1.0.json" cargo test -p mcp-trace-validator --test sarif -- --ignored

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build docs (zero warnings)
        run: cargo doc --workspace --no-deps
      # Feature-gated modules (the everything-server's `tap`) carry rustdoc the
      # default-feature build never sees; a broken intra-doc link there is only
      # caught with --all-features.
      - name: Build docs with all features (zero warnings)
        run: cargo doc --workspace --no-deps --all-features
      # One command, and the list of gates lives in `xtask`, not here. Four of
      # them used to be written out in this job while `changelog-links` and
      # `draft-coverage --check` ran only inside `cargo xtask ci` — which no
      # push or pull-request workflow invokes — so the gate that stops published
      # numbers from drifting did not run on the change that published them.
      - name: Offline gates (sizes, fuzz targets, links, versions, coverage projections)
        run: cargo xtask gates
      # Each of those gates, and the golden corpus, broken one at a time: a gate
      # that cannot go red is a comment. The checkout is clean, as the task
      # requires, and every file it edits is restored before the next gate.
      - name: Every gate shown able to fail
        run: cargo xtask falsify-gates

  book:
    name: Book (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The versioned site rebuilds every release tag's book.
          fetch-depth: 0
          fetch-tags: true
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install mdBook
        # Built from source under --locked rather than via a third-party setup
        # action: one fewer supply-chain dependency, the same discipline as the
        # plain-rustup toolchain installs. rust-cache restores the prior build.
        run: cargo install mdbook --locked --version 0.5.4
      - name: Build the versioned site (a missing include file or anchor fails here)
        # The same command pages.yml deploys from: main's book plus every
        # release's, so a change that breaks an older book's build, the
        # switcher, or the root copy fails here rather than at deploy.
        run: cargo xtask book-site --out site
      - name: Upload the rendered site
        # The bytes a deploy would serve; pages.yml builds them again on main.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book
          path: site
          if-no-files-found: error
          retention-days: 30

  # Every fuzz target built and run for a minute from its committed seeds, on
  # every push and PR. The weekly job fuzzes for five minutes per target with
  # an accumulated corpus; this one catches the crash a change introduces in
  # the PR that introduces it, and is the gate that every target still builds
  # (`cargo xtask fuzz-targets` checks only that each is declared).
  fuzz-smoke:
    name: Fuzz smoke (every target, 60 s)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz every declared target for 60 seconds
        run: |
          set -euo pipefail
          targets=$(cargo +nightly fuzz list)
          if [ -z "$targets" ]; then
            echo "::error::cargo fuzz list named no targets; nothing would be fuzzed"
            exit 1
          fi
          for target in $targets; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 30

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the release tag's commit (not the floating `v2` tag's
      # annotated-tag object, which the 2026-06-11 audit found this line
      # carrying: such an object survives only as an unreferenced blob in
      # upstream's object store once `v2` moves again — resolvable today,
      # GC bait tomorrow, and invisible to dependabot).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  package:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--workspace` resolves path+version deps against sibling crates rather than
      # crates.io, which is what pre-publish validation needs. xtask is publish=false
      # but `cargo package --workspace` still packages it (v0.1.0 shipped a stray
      # xtask .crate before release.yml learned this) — exclude it here for the same
      # reason, so this job validates exactly what a release would package.
      - name: Package all publishable crates
        run: cargo package --workspace --exclude xtask --locked
      # The release's SBOM step, rehearsed: release.yml's `package` job runs
      # this command and attests each file against its .crate. Here nothing is
      # signed; the point is that generation, and the one-per-published-crate
      # check inside it, cannot first fail after a tag.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: One CycloneDX SBOM per published crate (release dry run)
        run: |
          cargo xtask sbom --out target/package
          ls -l target/package/*.cdx.json

  # The published crates' Rust API against their crates.io baseline, on every
  # PR rather than only before a release, where an undeclared break is found
  # by whoever prepares it (v0.5.0's three were). One invocation,
  # `cargo xtask semver`, serves release.yml's `verify` job and this one;
  # the flag picks which release the tree is judged as:
  #   - release.yml runs it bare: the type follows the version bump, which on
  #     a release commit is the declaration being checked;
  #   - here `--unreleased`: between releases the version still equals the
  #     published one, which the tool reads as a patch, so a derived type would
  #     fail every PR after main's first deliberate pre-1.0 break. The tree is
  #     judged as the release CHANGELOG.md's [Unreleased] declares instead. A
  #     breaking-changes table (a `Migration` column) declares the next pre-1.0
  #     minor, a breaking release to Cargo and so `--release-type major` to the
  #     tool (its `minor` still refuses a removal at 0.x). That admits any
  #     break, so the job first prints every break, without failing, for the
  #     reviewer to hold against the table. No table promises no break: the
  #     gate runs at `minor`, and an API break fails the PR until declared.
  # Network: the baselines and the crates.io index (whether each crate has a
  # published version) are fetched, as in release.yml's verify job.
  semver:
    name: Semver (cargo-semver-checks vs crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-semver-checks
        # The version release.yml installs, so a PR and its release are judged
        # by the same tool.
        run: cargo install cargo-semver-checks --version 0.51.0 --locked
      - name: API compatibility, judged as the release [Unreleased] declares
        run: cargo xtask semver --unreleased

  # Line and region coverage of the shipped crates' tests, all features
  # (xtask excluded, as from the mutation standard: it ships nothing). Measured,
  # not gated, for the reason the benchmarks are: no baseline history exists,
  # and a threshold invented now would be folklore. No external service and no
  # token: the lcov file is an artifact and the summary goes to the job summary.
  coverage:
    name: Coverage (95% line floor)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain with llvm-tools
        # rust-toolchain.toml's minimal profile omits llvm-tools, which
        # cargo-llvm-cov needs; added to the pinned toolchain, not a floating one.
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Run the tests under coverage
        run: cargo llvm-cov --workspace --exclude xtask --all-features --locked --lcov --output-path lcov.info
      - name: Coverage summary
        shell: bash
        run: |
          set -euo pipefail
          # The floor sits about one point under the measured 96.40% of lines
          # (2026-10-13, all features), so a change that drops coverage
          # noticeably fails here.
          # The report is written first, so a failing run still shows the table.
          cargo llvm-cov report --summary-only | tee "$RUNNER_TEMP/coverage.txt"
          {
            echo "## Coverage (shipped crates' tests, all features)"
            echo ""
            echo '```text'
            cat "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --fail-under-lines 95 > /dev/null
      - name: Upload the lcov report
        # Also below the floor: the lines a failing run missed are the point.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 30

  nightly:
    name: Nightly (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        # `RUSTUP_TOOLCHAIN` below, not `rustup default`: rust-toolchain.toml is
        # a directory override and outranks the default, so a job that wants a
        # different toolchain has to say so in the environment.
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test (all features, nightly)
        run: cargo test --workspace --all-features

  # Proves the `>=` floors in workspace dependency ranges are real: resolve every
  # dependency to its minimum allowed version (nightly resolver flag), then build and
  # test on stable against that lockfile. Informational like the nightly job — a red
  # run means a floor needs raising, not that the tree is broken.
  minimal-versions:
    name: Minimal versions (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchains
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          # The non-nightly half of this job runs on the pinned toolchain, which
          # rust-toolchain.toml installs; `cargo +nightly` overrides it where the
          # unstable flag is needed.
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Resolve minimal versions
        run: cargo +nightly generate-lockfile -Zminimal-versions
      - name: Test against minimum dependency versions
        run: cargo test --workspace --all-features --locked

  # The M2+M3 hard gate: the pinned official suite's server scenarios against
  # the everything server over streamable HTTP, then the client leg — the
  # reference host as the suite's client SUT (four protocol scenarios,
  # sequential so the sse-retry clock is never under parallel load), a
  # child-process stdio smoke between the two real binaries, and the
  # agreement replay on both sides (cargo xtask conformance documents the
  # steps and the version pin). This job is the one deliberate exception
  # to "no network beyond the package registries": npx fetches the pinned
  # runner from npm, and the runner dials loopback in both directions. Tests
  # (`cargo test` anywhere in the workspace) still never touch a network.
  conformance:
    name: Conformance (official suite, server + client scenarios)
    # ubuntu-only by decision (third audit, 2026-06-13): the npx-gated legs
    # buy platform coverage of the *runner*, which upstream itself runs on
    # Linux. Our platform-variant surface — the tap and capture serialization
    # the validator consumes — is covered on every OS by the test-matrix
    # round-trips (tap_output_parses_and_validates_through_the_real_validator
    # and the host capture tests), so two more npx jobs would re-run Node to
    # re-prove Rust code already proven cross-platform.
    runs-on: ubuntu-latest
    # A warm run takes ~2 minutes; the bound exists because this is the one
    # job whose tools (npx, the runner) can hang on network state, and a
    # wedged job should fail in minutes, not at the 6-hour runner cap.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Runner prerequisites (Node is preinstalled on the runner image)
        run: node --version && npx --version
      - name: Official suite vs everything-server
        run: cargo xtask conformance
      - name: Upload scenario verdicts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-verdicts
          path: target/conformance/
          if-no-files-found: warn
          retention-days: 30

  # The HTML report as people see it (ADR-0021, "Verification of what people
  # see"): the committed golden pages (corpus/golden/html, pinned to the
  # renderer by the golden_html test in the test job) rendered by the Chromium
  # that the exact @playwright/test in visual/package-lock.json pins, compared
  # pixel for pixel with visual/tests/__screenshots__, and opened with every
  # request recorded and aborted (there must be none). No Rust here.
  #
  # ubuntu-24.04, not -latest: the baselines depend on the image's fontconfig
  # and on DejaVu, which the report's font stacks put first; a runner image
  # moving underneath them would turn a pinned comparison into a moving one.
  visual:
    name: Visual (HTML report screenshots, no network)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the font the baselines were taken with
        # fonts-dejavu-core is in the image already; naming the version makes
        # a change to it fail here, loudly, rather than as a pixel diff.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core=2.37-8
          fc-match "DejaVu Sans" && fc-match "DejaVu Sans Mono"
      - name: Install the pinned Playwright and its Chromium (Node is preinstalled on the runner image)
        working-directory: visual
        run: |
          node --version
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Screenshots, links and no-network checks
        working-directory: visual
        run: npx playwright test
      - name: Upload the actual, expected and diff images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: |
            visual/test-results/
            visual/playwright-report/
          if-no-files-found: warn
          retention-days: 30

  # Independent traffic: the official TypeScript and Python SDKs talk to each
  # other (TS client -> TS everything server at 2025-11-25, Python client ->
  # Python server at 2026-07-28, each over stdio and streamable HTTP), recorded
  # through mcp-trace-capture and judged by mcp-trace-validator. Every session
  # must judge `pass` at the revision its SDK speaks, and a 2025-06-18 session
  # from an older SDK must be refused with exit 2. SDK versions are pinned by
  # interop/package-lock.json and the hash-locked interop/requirements.txt.
  interop:
    name: Interop (official TypeScript and Python SDKs through capture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the recorder and the validator
        run: cargo build --locked -p mcp-trace-capture -p mcp-trace-validator
      - name: Install the pinned SDKs (Node and Python are preinstalled on the runner image)
        working-directory: interop
        run: |
          node --version && python3 --version
          npm ci --no-audit --no-fund
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r requirements.txt
      - name: Record and judge five sessions
        working-directory: interop
        run: PYTHON="$PWD/.venv/bin/python" ./run.sh ../target/debug
      - name: Upload traces and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-traces
          path: interop/out/
          if-no-files-found: warn
          retention-days: 30

  # The workflows themselves, linted: actionlint (expression and type checks,
  # shellcheck over every `run:` script) and zizmor (GitHub Actions security
  # audits: injection, credential persistence, cache poisoning, unpinned uses,
  # excessive permissions, Dependabot cooldown). Both tools are fetched at an
  # exact version and verified by hash before they run, the same rule the
  # actions themselves follow. A finding a change cannot fix is suppressed
  # inline, beside its stated reason (`# zizmor: ignore[...]`,
  # .github/actionlint.yaml) — never by lowering the persona.
  #
  # zizmor runs --offline: its online audits (impostor commits, tag/SHA
  # mismatches) need API access this job does not request. The pins were
  # checked against upstream tags by hand on 2026-10-04; Dependabot keeps
  # them current.
  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: "1.30.1"
      # zizmor-1.30.1-py3-none-manylinux_2_28_x86_64.whl, from PyPI's JSON API.
      ZIZMOR_SHA256: eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (release tarball, SHA-256 checked)
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" "$url"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (with shellcheck)
        run: |
          set -euo pipefail
          # The runner image ships ShellCheck; actionlint silently skips
          # script checks without it, so its absence is an error here.
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color
      - name: Install zizmor (exact version, hash-locked wheel)
        run: |
          set -euo pipefail
          printf 'zizmor==%s --hash=sha256:%s\n' "$ZIZMOR_VERSION" "$ZIZMOR_SHA256" > "$RUNNER_TEMP/zizmor-requirements.txt"
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary=:all: --no-deps \
            -r "$RUNNER_TEMP/zizmor-requirements.txt"
      - name: zizmor (workflows and dependabot.yml)
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --offline --format=github .github/'

  # The repository's own GitHub Action (action.yml), run as a user would run
  # it: built from this checkout, over passing traces (exit 0, reports written)
  # and over a violating one (exit 1, the step fails, the reports still written).
  action:
    name: GitHub Action (action.yml over the corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Shared by both runs of the action, so the second build is incremental.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `./`, not the newer `$/` self-repository form zizmor suggests: the
      # pinned actionlint (1.7.12) rejects `$/`, and this job's point is to run
      # the action.yml of the commit under test, which `./` names exactly.
      - name: Passing traces
        id: pass
        uses: ./ # zizmor: ignore[self-repository]
        with:
          traces: corpus/good/*.jsonl corpus/draft/good/*.jsonl
          sarif-file: pass.sarif
          junit-file: pass.xml
      - name: A violating trace
        id: fail
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository]
        with:
          traces: corpus/violations/base-003-request-id-reuse.jsonl
          sarif-file: fail.sarif
          junit-file: fail.xml
      # A pattern matching nothing must still leave valid reports behind, or
      # the `if: always()` upload step after it fails on a missing file.
      - name: A pattern matching no trace
        id: none
        uses: ./ # zizmor: ignore[self-repository]
        with:
          traces: corpus/no-such-directory/*.jsonl
          sarif-file: none.sarif
          junit-file: none.xml
          fail-on-findings: "false"
      - name: The action reported what each run decided
        shell: bash
        env:
          PASS_CODE: ${{ steps.pass.outputs.exit-code }}
          FAIL_CODE: ${{ steps.fail.outputs.exit-code }}
          FAIL_OUTCOME: ${{ steps.fail.outcome }}
          NONE_CODE: ${{ steps.none.outputs.exit-code }}
        run: |
          set -euo pipefail
          [[ "$PASS_CODE" == 0 ]] || { echo "::error::passing traces exited ${PASS_CODE}"; exit 1; }
          [[ "$FAIL_CODE" == 1 ]] || { echo "::error::violating trace exited ${FAIL_CODE}, expected 1"; exit 1; }
          [[ "$FAIL_OUTCOME" == failure ]] || { echo "::error::the failing run's step did not fail"; exit 1; }
          [[ "$NONE_CODE" == 2 ]] || { echo "::error::an unmatched pattern exited ${NONE_CODE}, expected 2"; exit 1; }
          jq -e '.runs[0].invocations[0].executionSuccessful == false' none.sarif
          grep -q '<error message="no trace matches' none.xml
          jq -e '.runs[0].results | length == 0' pass.sarif
          jq -e '.runs[0].results[0].ruleId == "BASE-003"' fail.sarif
          grep -q '<failure' fail.xml
