# Copyright 2026 Tom F. (https://github.com/tomtom215)
#
# Scheduled hygiene: weekly RustSec audit, the full mutation sweep that PR-scoped
# runs (mutants.yml) deliberately skip, fuzzing, a cargo-careful UB/overflow run
# over the engine crates, a cross-architecture (s390x/powerpc/i686) byte-identity
# check, a minimal-versions dependency-floor check, benchmarks, and the
# claims-expiry gates. Manually dispatchable for on-demand runs.

name: Scheduled

on:
  schedule:
    # Mondays 06:00 UTC — early enough that a red run is seen the same day.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Which of this workflow's jobs to run. `all` is the weekly sweep and
          the default. `claims` runs the claims-expire gates and their
          notification alone, skipping the mutation sweep, fuzzing, the
          cross-architecture matrix and the benchmarks — minutes rather than
          hours. It exists because the notification is the one part of this
          workflow whose live behaviour cannot be established any other way:
          `gh` either accepts those flags against a real repository or it does
          not, and the steps run inside an already-red job where a wrong flag
          shows up as an issue that never appears.
        type: choice
        default: all
        options:
          - all
          - claims

permissions:
  contents: read

env:
  # Every JavaScript action pinned here already declares `node24` (verified
  # 2026-07-26 at the pinned SHAs: actions/checkout v7.0.1 and Swatinem/rust-cache;
  # actions/attest-build-provenance is composite), so this is no longer the
  # load-bearing opt-in it was when checkout sat at v6.0.3 — it stays as a guard
  # so a future pin that predates the June 16, 2026 runner cutover cannot
  # silently run on the old runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-audit (RustSec)
    # Skipped by a `claims`-scoped dispatch; see the `only` input above.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  full-mutants:
    name: Mutants (full sweep)
    # Skipped by a `claims`-scoped dispatch; see the `only` input above.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      # The standard (docs/plan/04-engineering-standards.md): zero surviving mutants
      # in every shipped crate (xtask is excluded via .cargo/mutants.toml).
      - name: Full workspace sweep
        # `-- --all-features` for the same reason as the PR gate: mutation
        # coverage must include feature-gated code (see mutants.yml).
        run: cargo mutants --workspace --no-shuffle -- --all-features

  # Early warning on the suite's next line (docs/plan/03-conformance-strategy.md:
  # "track the 0.2.0-alpha line in a scheduled, non-blocking CI job"). The npm
  # `alpha` dist-tag floats by design — this job exists to hear breakage coming,
  # so it tracks whatever upstream currently calls alpha; the PR gate stays on
  # the exact pin in xtask. Failures here are signal to read, never a gate.
  suite-alpha:
    name: Conformance (suite alpha line, informational)
    # Skipped by a `claims`-scoped dispatch; see the `only` input above.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Official suite (alpha dist-tag) vs everything-server
        run: cargo xtask conformance
        env:
          MCP_SUITE_VERSION: alpha

  # How much of the *next* revision the current server already satisfies
  # (docs/plan/06-roadmap.md M2.5). Unlike suite-alpha above, this one gates:
  # its suite version and spec revision are both exact pins, so the measurement
  # is reproducible and a change in it is real news — either migration progress
  # or a regression. `BLESS=1 cargo xtask draft-readiness` re-records.
  draft-readiness:
    name: Draft readiness (2026-07-28 scenarios, ratcheted)
    # Skipped by a `claims`-scoped dispatch; see the `only` input above.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Draft scenarios vs everything-server, against the committed baseline
        run: cargo xtask draft-readiness

  fuzz:
    name: Fuzz (every declared target)
    # Skipped by a `claims`-scoped dispatch; see the `only` input above.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Five minutes per target weekly; committed seed corpora keep coverage warm.
      # The canonical_json target asserts parse(canonical(v)) == v, not mere survival,
      # and trace_parse runs every parseable input through the full validation engine.
      #
      # The list comes from `cargo fuzz list`, not from names written out here.
      # It used to be written out, and `registry_set_multi` — added 2026-07-27
      # with a seed corpus, to cover the only engine path whose *shape* is
      # attacker-influenced — was never added to it, so the newest target guarded
      # nothing while the job stayed green. `cargo xtask fuzz-targets` holds the
      # other end of the chain, checking that every target source is declared as
      # a `[[bin]]` and so visible to `cargo fuzz list` at all.
      - name: Fuzz every declared target
        run: |
          set -euo pipefail
          targets=$(cargo +nightly fuzz list)
          if [ -z "$targets" ]; then
            echo "::error::cargo fuzz list named no targets; nothing would be fuzzed"
            exit 1
          fi
          echo "fuzzing: $(echo $targets | tr '\n' ' ')"
          for target in $targets; do
            cargo +nightly fuzz run "$target" -- -max_total_time=300
          done
      # The corpus libFuzzer grew this run, uploaded so coverage accumulates
      # across weeks instead of restarting from the committed seeds (the
      # round-two deferral "corpora seed-only", liquidated). Promoting an
      # interesting artifact into the committed seeds stays a deliberate PR.
      - name: Upload grown corpora
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpora-${{ github.run_id }}
          path: fuzz/corpus/
          if-no-files-found: warn
          retention-days: 90

  # The engine crates' test suites, run against a std built with debug
  # assertions and extra const-UB checks (cargo-careful). A `forbid(unsafe_code)`
  # crate cannot author UB itself, but the dependencies it exercises can, and an
  # integer-overflow or const-UB regression a release build folds silently fails
  # here. This is the correctness floor mutation and fuzzing hold, viewed through
  # a third lens; nightly-bound like the fuzz job, and a real gate, not
  # informational — a finding is a genuine defect, not a nightly-churn artifact.
  careful:
    name: cargo-careful (UB / overflow on the engine crates)
    # Skipped by a `claims`-scoped dispatch; see the `only` input above.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly toolchain (with rust-src for the careful sysroot)
        run: rustup toolchain install nightly --profile minimal --component rust-src --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-careful
        run: cargo install cargo-careful --locked
      # These two crates have no behavior-affecting feature split — core has no
      # features, and the validator's only feature (`cli`) is its default — so
      # `--all-features` is the whole surface and one careful build covers it.
      # Mutation and fuzz already hold these crates to the highest bar; this is a
      # third lens. `careful` builds the checked sysroot on first run (rust-src).
      - name: Run the engine suites under the careful sysroot
        run: cargo +nightly careful test -p mcp-conformance-core -p mcp-trace-validator --all-features

  # Byte-identical output across architectures (M1 DoD: "byte-identical reports
  # across platforms"). Every other job here runs 64-bit little-endian — the CI
  # hosts are x86-64/aarch64 Linux/macOS/Windows — so the canonical JSON form,
  # the JSON/JUnit reports, and the golden corpus had only ever been pinned
  # 64-bit little-endian. This matrix runs the engine crates' suites on the three
  # corners of the (endianness x pointer-width) square those hosts leave untested:
  # s390x (64-bit BE) and powerpc (32-bit BE) under qemu-user, and i686 (32-bit
  # LE) natively via multilib. The arches are split into separate runners because
  # the 32-bit gcc-multilib and the big-endian cross-gccs hard-conflict at the
  # dpkg level (Conflicts:), so they cannot share one apt root; each leg installs
  # only its own toolchain and `cargo xtask cross-arch` runs that arch and loudly
  # skips the rest. On the qemu targets two tests are out of scope by construction
  # — a native frame-budget proof (non-portable to emulation, as under miri) and
  # the cli suite (a cross-built child qemu-user cannot exec without binfmt); i686
  # runs natively, so its whole suite runs unskipped. A byte-for-byte divergence
  # on any of them is a real defect, not a nightly-churn artifact.
  cross-arch:
    name: Cross-arch byte-identity (${{ matrix.note }})
    # Skipped by a `claims`-scoped dispatch; see the `only` input above.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: s390x-unknown-linux-gnu
            apt: gcc-s390x-linux-gnu qemu-user-static
            note: s390x 64-bit BE
          - rust_target: powerpc-unknown-linux-gnu
            apt: gcc-powerpc-linux-gnu qemu-user-static
            note: powerpc 32-bit BE
          - rust_target: i686-unknown-linux-gnu
            apt: gcc-multilib
            note: i686 32-bit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain (with the ${{ matrix.rust_target }} std target)
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the cross toolchain for ${{ matrix.note }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      - name: Build and run the engine suite on ${{ matrix.note }}
        run: cargo xtask cross-arch

  # Dependency floors are honest: the declared `>=x.y.z` lower bounds are the
  # oldest versions the workspace actually resolves to and builds/tests against,
  # not assertions. `cargo xtask minimal-versions` pins every direct dependency
  # to its floor (-Z direct-minimal-versions, nightly), builds the workspace, and
  # runs the engine suites there. A floor below the resolvable minimum (a
  # transitive crate forces higher) fails the resolution; a floor below an API
  # the code uses fails the build. Scheduled, not per-PR: upstream churn can make
  # a floor newly dishonest with no local change — a maintenance signal, like the
  # claims-expiry gates, not a defect in unrelated work.
  minimal-versions:
    name: Dependency floors (oldest versions resolve, build, and test)
    # Skipped by a `claims`-scoped dispatch; see the `only` input above.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly (for -Z direct-minimal-versions) and stable
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          # The non-nightly half of this job runs on the pinned toolchain, which
          # rust-toolchain.toml installs; `cargo +nightly` overrides it where the
          # unstable flag is needed.
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Resolve to the declared floors, then build and test there
        run: cargo xtask minimal-versions

  # Bench history accumulates as weekly artifacts (the round-two deferral
  # "bench history not accumulating", liquidated): measured, never gated —
  # benches/README.md records why no threshold exists. Compare runs by
  # downloading two artifacts and diffing criterion's estimates.
  bench:
    name: Benchmarks (history artifact)
    # Skipped by a `claims`-scoped dispatch; see the `only` input above.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run benchmarks
        run: cargo bench --workspace
      - name: Upload criterion estimates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-history-${{ github.run_id }}
          path: target/criterion/
          if-no-files-found: error
          retention-days: 90

  # The claims-expire gates (ADR-0010): the deferral ledger's review-by dates,
  # the registry's verbatim quotes, and the two official-suite pins, all
  # re-verified weekly. Failures
  # here page the schedule, not PRs — an expired deferral or a drifted quote
  # is a maintenance event, not a defect in unrelated work. That split is
  # unchanged; what changed (2026-08-18) is the last mile. "Pages the schedule"
  # used to mean GitHub's default scheduled-failure email and nothing else, and
  # two ledger rows expired unnoticed behind it, found by hand. So a red run now
  # opens a tracking issue that names the expired rows, and a green run closes
  # it — the issue's open/closed state tracks the gates', which is the property
  # an email cannot have.
  #
  # Security surface (docs/plan/05-security-model.md §CI write scopes, and the
  # 2026-08-18 amendment to ADR-0010):
  #
  #   * `issues: write` is granted on this job alone; the workflow default
  #     stays `contents: read`, so every other job here is unchanged.
  #   * No new action dependency: `gh` ships on the runner and is already this
  #     repository's idiom for GITHUB_TOKEN work (release.yml). Nothing new to
  #     pin, review, or trust.
  #   * The issue body is built from the committed ledger and the two step
  #     outcomes. `spec-drift` fetches remote specification text, and none of
  #     that text is republished into an issue — the run log carries it.
  #   * This workflow triggers only on `schedule` and `workflow_dispatch`, so
  #     no fork or pull-request input reaches the token.
  claims-expire:
    name: Deferral ledger + spec quotes + suite pins (ADR-0010)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open, comment on, and close the tracking issue below
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # One stable title is the whole de-duplication key: a run that is still
      # red comments on the open issue instead of filing a new one every Monday.
      ISSUE_TITLE: "Weekly claims-expire run is red (ADR-0010)"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the pinned toolchain (installs it from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Deferral ledger within its review dates
        id: ledger
        run: cargo xtask deferrals --check
      # `always()`: the two gates are independent, and a red ledger used to skip
      # the drift gate entirely — so a week with an expired row measured the
      # quotes not at all, while still showing as one red job.
      - name: Registry quotes match the published spec text
        id: drift
        if: always()
        run: cargo xtask spec-drift
      # The third claim that expires on somebody else's schedule: an upstream
      # suite release. The pins stay exact and bumping one stays a deliberate PR
      # (03-conformance-strategy §Official-suite version policy) — what this
      # automates is the *noticing*, which had been a dated line in the deferral
      # ledger and had already missed two alpha releases.
      - name: Both suite pins still equal the dist-tags they track
        id: pins
        if: always()
        run: cargo xtask suite-currency
      # The fourth claim on somebody else's schedule, and the one that had no
      # noticing at all: a Rust release. The pin stays exact and bumping it
      # stays a deliberate commit; a release used to arrive as thirteen
      # consecutive red pull-request runs instead.
      - name: The pinned toolchain still equals current stable
        id: toolchain
        if: always()
        run: cargo xtask toolchain-currency
      - name: Open or update the tracking issue
        if: failure()
        shell: bash
        env:
          LEDGER_OUTCOME: ${{ steps.ledger.outcome }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          PINS_OUTCOME: ${{ steps.pins.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
        run: |
          set -euo pipefail
          # printf rather than a heredoc so every backtick in the Markdown is
          # literal, and so nothing fetched from the network can reach the body.
          {
            printf 'The weekly `claims-expire` job ended red.\n\n'
            printf 'It runs four independent gates ([ADR-0010](%s/%s/blob/main/docs/plan/decisions/0010-deferral-ledger-and-scheduled-reverification.md)), so this issue names which one: an un-re-decided deferral, an upstream release, a Rust release, and a transient spec fetch failure look identical from the outside.\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
            printf '| Gate | Outcome |\n| --- | --- |\n'
            printf '| Deferral ledger within its review dates | `%s` |\n' "$LEDGER_OUTCOME"
            printf '| Registry quotes match the published spec text | `%s` |\n' "$DRIFT_OUTCOME"
            printf '| Both suite pins still equal the dist-tags they track | `%s` |\n' "$PINS_OUTCOME"
            printf '| The pinned toolchain still equals current stable | `%s` |\n' "$TOOLCHAIN_OUTCOME"
          } > issue-body.md
          if [[ "$LEDGER_OUTCOME" == "failure" ]]; then
            # `|| true`: this query fails only when the ledger itself is
            # unreadable or malformed, which is a different diagnosis than an
            # expired row and is reported as one below.
            rows="$(cargo xtask deferrals --expired 2>/dev/null || true)"
            {
              printf '\n### Expired ledger rows\n\n'
              if [[ -n "$rows" ]]; then
                printf 'Re-decide each one: build the deferred thing and delete its row, or re-date it with a fresh reason in the same commit (`docs/plan/deferrals.json`).\n\n'
                while read -r id review_by; do
                  printf -- '- `%s` — review by %s\n' "$id" "$review_by"
                done <<< "$rows"
              else
                printf 'The ledger gate failed with no row past its review date, so the ledger itself did not parse or did not satisfy its shape rules. The run log names the offending row.\n'
              fi
            } >> issue-body.md
          fi
          if [[ "$DRIFT_OUTCOME" == "failure" ]]; then
            {
              printf '\n### Spec-quote drift\n\n'
              printf 'The drift gate fetches the published specification, so red here is either a genuine quote drift or a transient fetch failure. The run log names the entry and the page; the fetched text is deliberately not republished here.\n'
            } >> issue-body.md
          fi
          if [[ "$PINS_OUTCOME" == "failure" ]]; then
            {
              printf '\n### Suite pins\n\n'
              printf 'A pinned conformance-suite version no longer equals the npm dist-tag it tracks. The run log names which pin and what the tag moved to; the bump itself stays a deliberate change, with the per-pin procedure in `docs/plan/03-conformance-strategy.md`. Holding the pin is a legitimate outcome, recorded where the pin lives.\n'
            } >> issue-body.md
          fi
          if [[ "$TOOLCHAIN_OUTCOME" == "failure" ]]; then
            {
              printf '\n### Toolchain pin\n\n'
              printf 'A new Rust stable has shipped and `rust-toolchain.toml` still pins the old one. Bumping is a deliberate commit: raise `channel`, run `cargo xtask ci`, and fix or record what the new lints say in the same commit. Holding the pin is a legitimate outcome, recorded where the pin lives. The run log names both versions.\n'
            } >> issue-body.md
          fi
          printf '\nRun: %s\n' "$RUN_URL" >> issue-body.md
          # An exact-title match over the open issues, not `gh issue list
          # --search`, whose index lags creation by enough to file a duplicate.
          number="$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg title "$ISSUE_TITLE" 'map(select(.title == $title)) | .[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file issue-body.md
            action="commented on #$number"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
            action="opened"
          fi
          # These steps run inside a job that is already red, so a broken `gh`
          # adds one more red step to a run whose colour was never going to
          # change, and the only symptom is an issue that never appears —
          # nobody watches for the absence of a notification. Stating the
          # outcome on the run summary makes the absence itself visible.
          {
            printf '### claims-expire notification\n\n'
            printf 'Tracking issue **%s**. A red run without this line means the notification step did not finish.\n' "$action"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Close the tracking issue once all three gates are green
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg title "$ISSUE_TITLE" 'map(select(.title == $title)) | .[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue close "$number" --comment "All three gates are green as of ${RUN_URL} — closing. A later red run files a fresh issue, so each incident keeps its own history."
            printf '### claims-expire notification\n\nTracking issue **#%s closed** — all three gates are green.\n' "$number" \
              >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
