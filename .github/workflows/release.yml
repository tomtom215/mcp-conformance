# Copyright 2026 Tom F. (https://github.com/tomtom215)
#
# Release pipeline (RELEASING.md is the specification this implements; the job
# shape follows a2a-rust's proven release.yml, hardened per ADR-0007):
#
#   verify ──┬──► package (attest + SHA256SUMS) ──► github-release ──► publish
#            │                                                          └──► verify-install
#   tests ───┘                                                         (release env,
#                                                                       OIDC)
#
# Raised bars relative to the a2a-rust baseline it derives from:
#   - no third-party toolchain action (plain rustup, like ci.yml) — nothing
#     unpinned runs in the publish privilege context;
#   - OIDC trusted publishing — config proven live by the v0.2.0 publish; this
#     job has no token fallback (ADR-0007 §Correction);
#   - `--locked` packaging WITH verification builds (no `--no-verify`);
#   - packaging determinism proven, not assumed: the publish job re-packages
#     and byte-compares against the attested SHA256SUMS before uploading;
#   - cargo-semver-checks gates API compatibility against the crates.io
#     baseline in `verify`, so a declared behavioral break is never confused
#     with an accidental, undeclared API-signature break;
#   - `workflow_dispatch` rehearses every gate without publishing anything;
#   - the publish job compiles nothing: it holds the OIDC grant, so no
#     dependency build script or restored cache runs beside it.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # stable:      v0.1.0
      - "v[0-9]+.[0-9]+.[0-9]+-*" # pre-release: v0.2.0-rc.1
  workflow_dispatch: # rehearsal from a release/vX.Y.Z branch; never publishes

# Default-deny; each job requests exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-publish: a half-published dependency chain is
  # worse than a queued duplicate (verify fails fast on a stale re-run).
  cancel-in-progress: false

env:
  # Every JavaScript action pinned here already declares `node24` (verified
  # 2026-07-26 at the pinned SHAs: actions/checkout v7.0.1 and Swatinem/rust-cache;
  # actions/attest-build-provenance is composite), so this is no longer the
  # load-bearing opt-in it was when checkout sat at v6.0.3 — it stays as a guard
  # so a future pin that predates the June 16, 2026 runner cutover cannot
  # silently run on the old runtime.
  # A release must not be the first place a runtime cutover is discovered.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # The published crates, in the order they reach crates.io. `cargo publish`
  # resolves a crate's dev-dependencies against the registry as well as its
  # normal ones, so every workspace sibling a crate names in ANY dependency
  # table must already be published. The edges (verified from `cargo metadata`;
  # the verify job re-checks them on every run):
  #   validator         -> core (normal)
  #   everything-server -> core (normal, optional), validator (dev)
  #   reference-host    -> core, everything-server, validator (all dev)
  #   capture           -> core (normal), everything-server, validator (dev)
  PUBLISH_ORDER: >-
    mcp-conformance-core mcp-trace-validator mcp-everything-server
    mcp-reference-host mcp-trace-capture

jobs:
  # ── Gate 1: tag ↔ version ↔ changelog agreement, full local gate set ───────
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchains (stable + MSRV)
        run: |
          # The pinned toolchain comes from rust-toolchain.toml, with clippy
          # and rustfmt among its components; 1.88.0 is the MSRV leg's.
          rustup show active-toolchain
          rustup toolchain install 1.88.0 --profile minimal --component clippy --no-self-update
      # Cached: this job and `tests` run gates and produce no release artifact
      # and hold no write scope. The caches a tag run can read are the ones
      # runs on `main` (or this tag) wrote, and writing those takes the same
      # push access that could edit this workflow outright. The jobs whose
      # output is signed or published (`package`, `binaries`, `publish`) do
      # not restore a cache at all.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
      - name: Tag, workspace version, and changelog agree
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          DISTINCT="$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | length')"
          if [[ "$DISTINCT" != "1" ]]; then
            echo "::error::workspace crate versions diverge; [workspace.package] is the single source"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${VERSION}"
              exit 1
            fi
          else
            echo "::notice::rehearsal run — tag check skipped; verifying readiness for v${VERSION}"
          fi
          if [[ "$VERSION" =~ - ]]; then IS_PRE=true; else IS_PRE=false; fi
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [${VERSION}]' section — move [Unreleased] before tagging"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"
      - name: Full local gate set (fmt, clippy, tests, docs, coverage sync)
        run: cargo xtask ci
      - name: MSRV gates (clippy + tests on 1.88)
        run: |
          cargo +1.88.0 clippy --workspace --all-targets --all-features -- -D warnings
          cargo +1.88.0 test --workspace --all-features
      - name: cargo-deny (advisories, bans, licenses, sources)
        # Compiled from source with --locked rather than the Docker-image action:
        # immune to registry-pull flakes at the moment that matters most.
        run: |
          # Pinned: the version a gate runs is part of the gate. 0.20.2 is the
          # version cargo-deny-action's pinned image runs in ci.yml, so PR CI
          # and the release judge with the same tool.
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
      - name: cargo-semver-checks (declared breaks are not accidental API breaks)
        # The verdict-as-contract gate (design note §9): an API-breaking change
        # shipped under a version bump that does not admit one fails here, so the
        # changelog's deliberate, declared behavioral breaks are never confused
        # with an undeclared API-signature break. `cargo xtask semver` runs
        # `cargo semver-checks check-release --workspace --exclude xtask` against
        # the published crates.io baseline — network-bound (it fetches the
        # baseline), which a release verify job already is. Compiled from source
        # with --locked, like cargo-deny above.
        run: |
          # Pinned for the same reason; 0.50.0 is the version every pre-flight
          # since v0.5.0 recorded, and the one the v0.6.0 rehearsal resolved.
          cargo install cargo-semver-checks --version 0.50.0 --locked
          cargo xtask semver
      - name: Publish order respects every internal dependency edge (dev included)
        shell: bash
        run: |
          set -euo pipefail
          # A crate published before a sibling it names — even only as a
          # dev-dependency — fails `cargo publish` with "failed to select a
          # version", mid-chain. Check PUBLISH_ORDER against the manifests.
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/meta.json"
          read -r -a order <<< "$PUBLISH_ORDER"
          declare -A pos
          for i in "${!order[@]}"; do pos[${order[$i]}]=$i; done
          publishable="$(jq -r '.packages[] | select(.publish != []) | .name' "$RUNNER_TEMP/meta.json" | sort)"
          listed="$(printf '%s\n' "${order[@]}" | sort)"
          if [[ "$publishable" != "$listed" ]]; then
            echo "::error::PUBLISH_ORDER does not list exactly the publishable crates: ${publishable//$'\n'/ }"
            exit 1
          fi
          bad=0
          while read -r crate dep kind; do
            [[ -n "${pos[$crate]:-}" && -n "${pos[$dep]:-}" ]] || continue
            if (( pos[$dep] >= pos[$crate] )); then
              echo "::error::${crate} (${kind}-depends on ${dep}) is published before it"
              bad=1
            fi
          done < <(jq -r '[.packages[].name] as $ws | .packages[] | .name as $n
                          | .dependencies[] | select(.name as $d | $ws | index($d))
                          | "\($n) \(.name) \(.kind // "normal")"' "$RUNNER_TEMP/meta.json")
          exit "$bad"


  # ── Gate 2: cross-platform tests, mirroring the ci.yml matrix ──────────────
  tests:
    name: Test (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup show active-toolchain
      # Cached for the reason given in `verify`: gates only, no artifact.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
      - name: Test (all features)
        run: cargo test --workspace --all-features

  # ── Package once, checksum, attest, share the exact bytes ──────────────────
  package:
    name: Package and attest
    needs: [verify, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC identity for SLSA provenance signing
      attestations: write # store the attestation in the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup show active-toolchain
      # No rust-cache: this job signs what it builds (id-token +
      # attestations), so it starts from a clean target directory rather than
      # one restored from another run.
      - name: Package all publishable crates (verification builds included)
        # The workspace-wide dry-run: per-crate `publish --dry-run` cannot
        # resolve unpublished sibling dependencies on a first release, while
        # `cargo package` resolves them locally. xtask is publish = false yet
        # `cargo package --workspace` still packages it (observed in v0.1.0,
        # whose release carries a stray xtask crate file) — exclude it.
        run: cargo package --workspace --exclude xtask --locked
      - name: Exactly the published crates, at this version, and nothing else
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd target/package
          read -r -a order <<< "$PUBLISH_ORDER"
          for crate in "${order[@]}"; do
            [[ -f "${crate}-${VERSION}.crate" ]] || { echo "::error::missing ${crate}-${VERSION}.crate"; exit 1; }
          done
          count="$(find . -maxdepth 1 -name '*.crate' | wc -l)"
          [[ "$count" -eq "${#order[@]}" ]] || { echo "::error::${count} .crate files, expected ${#order[@]}"; ls; exit 1; }
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd target/package
          sha256sum ./*.crate | tee SHA256SUMS
      - name: Attest build provenance (SLSA)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            target/package/*.crate
            target/package/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  # ── Prebuilt binaries: both CLIs per platform, attested like the crates ─────
  # `cargo install` compiles for minutes; these are the same two binaries from
  # the same tagged source, built with the workspace's release profile. Linux is
  # musl, statically linked, so one archive runs on any distribution. Each
  # archive is attested (tag runs only, like the crates) and checksummed in the
  # github-release job; `cargo binstall` finds them through each crate's
  # `[package.metadata.binstall]`. A rehearsal (workflow_dispatch) builds every
  # target, so a platform that no longer builds fails before a tag exists.
  binaries:
    name: Binaries (${{ matrix.target }})
    needs: [verify, tests]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # OIDC identity for SLSA provenance signing
      attestations: write # store the attestation in the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          # crt-static: link the C runtime statically, so the archive does not
          # depend on VCRUNTIME140.dll being installed (the Windows analogue
          # of the static musl builds above). Applied through RUSTFLAGS with
          # an explicit --target, so it reaches the target artifacts only,
          # never host build scripts or proc macros.
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip, rustflags: "-C target-feature=+crt-static" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain and target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"
      - name: Install the musl C toolchain (ring compiles C)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # No rust-cache, for the reason given in `package`: these archives are
      # attested and shipped, so nothing compiled into them may come from a
      # restored cache. A clean build per target costs minutes, once per release.
      - name: Build both CLIs
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p mcp-trace-validator -p mcp-trace-capture --bins
      - name: Smoke-test the binaries (native targets)
        # The x86_64 macOS build is cross-compiled on an arm64 runner, where
        # running it depends on Rosetta being on the image; it is built and
        # archived, not run.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release"
          "$BIN/mcp-trace-validator" --version | grep -Fx "mcp-trace-validator ${VERSION}"
          "$BIN/mcp-trace-capture" --version | grep -Fx "mcp-trace-capture ${VERSION}"
          # A violation trace must exit 1 (findings): 0 means it passed, and 2
          # means the binary could not judge it at all. Both fail the step.
          status=0
          "$BIN/mcp-trace-validator" validate corpus/draft/violations/mrtr-019-retry-reuses-id.jsonl --quiet || status=$?
          if [[ "$status" -ne 1 ]]; then
            echo "::error::a violation trace exited ${status}, expected 1"
            exit 1
          fi
      - name: Archive
        id: archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # This name is what each crate's [package.metadata.binstall] pkg-url
          # and bin-dir templates expect; change both together.
          NAME="mcp-conformance-v${VERSION}-${TARGET}"
          EXT=""
          if [[ "$TARGET" == *windows* ]]; then EXT=".exe"; fi
          mkdir "$NAME"
          cp "target/${TARGET}/release/mcp-trace-validator${EXT}" \
             "target/${TARGET}/release/mcp-trace-capture${EXT}" \
             LICENSE README.md "$NAME/"
          if [[ "$ARCHIVE" == zip ]]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          echo "file=$NAME.${ARCHIVE}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (SLSA)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.file }}
      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: ${{ steps.archive.outputs.file }}
          retention-days: 90
          if-no-files-found: error

  # ── GitHub Release before crates.io (RELEASING.md order; idempotent) ────────
  github-release:
    name: Create GitHub release
    needs: [verify, package, binaries]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts/
      - name: Download the binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release-binaries/
      - name: Checksum the binary archives
        # Kept apart from SHA256SUMS, which covers exactly the .crate files the
        # publish job re-packages and byte-compares against it.
        shell: bash
        run: |
          set -euo pipefail
          cd release-binaries
          ls
          count="$(find . -maxdepth 1 -type f | wc -l)"
          [[ "$count" -eq 5 ]] || { echo "::error::expected 5 archives, found ${count}"; exit 1; }
          sha256sum ./* | tee ../SHA256SUMS-binaries
      - name: Extract changelog section
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^## \[/ { flag = 0 }
            flag' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::empty changelog excerpt for ${VERSION}"
            exit 1
          fi
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PRE_FLAG=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then PRE_FLAG="--prerelease"; fi
          # Idempotent: a re-run (or a release created via the web UI alongside
          # the tag) updates in place instead of failing.
          if gh release view "$TAG" &>/dev/null; then
            echo "::warning::release ${TAG} already exists — updating in place"
            gh release edit "$TAG" $PRE_FLAG --title "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" --clobber release-artifacts/*.crate release-artifacts/SHA256SUMS \
              release-binaries/* SHA256SUMS-binaries
          else
            gh release create "$TAG" \
              --verify-tag \
              $PRE_FLAG \
              --title "$TAG" \
              --notes-file release-notes.md \
              release-artifacts/*.crate release-artifacts/SHA256SUMS \
              release-binaries/* SHA256SUMS-binaries
          fi

  # ── Publish to crates.io (protected environment; OIDC-only) ────────────────
  publish:
    name: Publish to crates.io
    needs: [verify, github-release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Settings → Environments → release: required reviewer + tag-only rule.
    environment:
      name: release
      url: https://crates.io/crates/mcp-conformance-core/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # OIDC exchange with crates.io (trusted publishing)
    # Nothing in this job compiles. It holds the OIDC grant that crates.io's
    # trusted publisher accepts (workflow release.yml + environment release),
    # so it must not run code it did not write: no dependency build script, no
    # proc macro, no cache restored from another run. The verification builds
    # already ran — `package` above (`cargo package` without --no-verify) and
    # the full gate set in `verify` — so here packaging and publishing both
    # pass --no-verify, and the byte comparison against the attested
    # SHA256SUMS stays the fail-closed check that the bytes are the same.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup show active-toolchain
      - name: Download attested artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: attested/
      - name: Prove packaging determinism against the attested checksums
        # `cargo publish` re-packages from source, so what reaches crates.io is
        # this job's packaging. Byte-comparing it against the attested
        # SHA256SUMS makes "the attestation covers these bytes" a checked fact
        # rather than an assumption. `--check --strict` fails on any mismatch
        # or malformed line, and every attested file must be present.
        shell: bash
        run: |
          set -euo pipefail
          cargo package --workspace --exclude xtask --locked --no-verify
          cd target/package
          sha256sum --check --strict ../../attested/SHA256SUMS
      - name: Authenticate with crates.io (OIDC trusted publishing)
        # This 30-minute OIDC-minted token is the only credential this workflow
        # can publish with — there is no token fallback (ADR-0007 §Correction).
        id: oidc
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in dependency order (idempotent, resumable)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.oidc.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Resumable fix-forward (a2a-rust pattern, minus yank recovery — this
          # project never yanks to repair a release). A version already on
          # crates.io is success, so re-running a partially published tag
          # skips completed crates and continues the chain. cargo reports that
          # case before uploading as "crate X@V already exists on crates.io
          # index"; "already uploaded" is the registry's own wording when the
          # pre-check races. Both are matched.
          #
          # Only transient failures are retried: HTTP 5xx, curl's network and
          # timeout codes, and a sibling not yet visible in the index (cargo
          # waits for each upload to appear, but gives up after a minute and
          # carries on). Anything else — a 4xx such as a trusted-publishing
          # refusal for a crate with no publisher configured, a manifest
          # error — cannot succeed on retry and fails at once, with the log.
          already='already (uploaded|exists on)'
          transient='status 5[0-9][0-9]|\[(6|7|28|35|52|55|56)\] |[Tt]imed out|[Tt]imeout was reached|[Cc]onnection (reset|refused|closed)|failed to select a version for the requirement `mcp-'

          publish_crate() {
            local crate="$1" max_attempts=5 attempt=1 log="${RUNNER_TEMP}/publish-${1}.log"
            echo "::group::cargo publish — ${crate} v${VERSION}"
            while true; do
              if cargo publish -p "$crate" --locked --no-verify 2>&1 | tee "$log"; then
                echo "::endgroup::"
                return 0
              fi
              if grep -qE "$already" "$log"; then
                echo "::warning::${crate} v${VERSION} already on crates.io — resuming with the next crate"
                echo "::endgroup::"
                return 0
              fi
              if ! grep -qE "$transient" "$log"; then
                echo "::error::cargo publish -p ${crate} failed with a non-transient error (log above); not retrying"
                echo "::endgroup::"
                return 1
              fi
              if (( attempt >= max_attempts )); then
                echo "::error::cargo publish -p ${crate} failed after ${max_attempts} attempts"
                echo "::endgroup::"
                return 1
              fi
              local wait=$(( 10 * 2 ** (attempt - 1) ))
              echo "::warning::transient publish failure — retrying in ${wait}s (attempt ${attempt}/${max_attempts})"
              sleep "$wait"
              attempt=$(( attempt + 1 ))
            done
          }

          # PUBLISH_ORDER (workflow env) lists every crate after each sibling it
          # names in any dependency table; the verify job checked that.
          read -r -a order <<< "$PUBLISH_ORDER"
          for crate in "${order[@]}"; do
            publish_crate "$crate"
          done

          {
            echo "## Published v${VERSION} to crates.io"
            echo ""
            echo "| Crate | Link |"
            echo "|-------|------|"
            for crate in "${order[@]}"; do
              echo "| ${crate} | [crates.io](https://crates.io/crates/${crate}/${VERSION}) |"
            done
            echo ""
            echo "> docs.rs builds follow within minutes. Published via OIDC trusted"
            echo "> publishing."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Prove the published artifact is actually installable ───────────────────
  # RELEASING.md step 5 used to say "install path works on a clean machine" and
  # leave it to a human. This is that step, automated. It can only run AFTER
  # publish — `mcp-trace-validator` depends on `mcp-conformance-core`, so
  # installing it from the registry is impossible until the sibling is there,
  # which is the same circularity that makes `cargo package` (not per-crate
  # `--dry-run`) the pre-publish check.
  #
  # Honest about what it is: a DETECTOR, not a preventer. By the time it runs,
  # the version is on crates.io and cannot be replaced. What it buys is finding
  # out from CI, within minutes, rather than from a user's bug report — the
  # failure it exists for is a packaging bug (an `include`d file missing from
  # the .crate) that every pre-publish gate passes because the workspace still
  # has the file on disk.
  #
  # Deliberately NOT cached: a warm registry and target dir would defeat the
  # "clean machine" claim this job makes.
  verify-install:
    name: Install from crates.io (${{ matrix.toolchain }})
    needs: [verify, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Stable is what most users have; MSRV proves the published artifact
        # honours the floor the manifest declares, which no pre-publish gate
        # checks against the *packaged* form.
        toolchain: [stable, "1.88"]
    permissions:
      contents: read
    steps:
      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$TOOLCHAIN"
      - name: cargo install the two user-facing tools, exactly as the README tells users to
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          for crate in mcp-trace-validator mcp-trace-capture; do
            # The sparse index can lag behind a completed publish at some CDN
            # edges, so a miss here is retried before it is believed.
            installed=0
            for attempt in 1 2 3 4 5; do
              if cargo install "${crate}" --version "${VERSION}"; then
                installed=1; break
              fi
              echo "::warning::${crate} install attempt ${attempt} failed; the index may still be propagating"
              sleep $(( attempt * 20 ))
            done
            [[ "${installed}" == "1" ]] || { echo "::error::cargo install ${crate} failed after 5 attempts"; exit 1; }
          done
      - name: The installed binaries run and are the version we published
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Closes the loop: resolving and building is not the same as shipping
          # a binary that starts and reports itself correctly.
          for binary in mcp-trace-validator mcp-trace-capture; do
            got="$("${binary}" --version)"
            echo "installed: ${got}"
            grep -qF "${VERSION}" <<<"${got}" || {
              echo "::error::installed ${binary} reports '${got}', expected ${VERSION}"
              exit 1
            }
            "${binary}" --help >/dev/null
          done
      - name: The pinned graph is coherent too (`--locked`)
        # The unlocked install above is the user-facing command; this one proves
        # the Cargo.lock published inside the crate still resolves, so a future
        # `--locked` install (the reproducible one) is not already broken.
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          for crate in mcp-trace-validator mcp-trace-capture; do
            cargo install "${crate}" --version "${VERSION}" --locked --force
          done
