#
# Mutation testing, diff-scoped to the PR (the a2a-rust `--in-diff` pattern): every
# mutant in changed code must be caught by a test. The full-workspace sweep runs on a
# schedule in scheduled.yml; this gate keeps PR feedback fast while still enforcing
# the zero-surviving-mutants standard where it matters most — the code being changed.

name: Mutants

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  # Every JavaScript action pinned here already declares `node24` (verified
  # 2026-07-26 at the pinned SHAs: actions/checkout v7.0.1 and Swatinem/rust-cache;
  # actions/attest-build-provenance is composite), so this is no longer the
  # load-bearing opt-in it was when checkout sat at v6.0.3 — it stays as a guard
  # so a future pin that predates the June 16, 2026 runner cutover cannot
  # silently run on the old runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  shards:
    name: Mutants (PR diff, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Sharded because one job took 1 h 45 min – 2 h on PR #59's diff (776
    # mutants). `--shard k/4` partitions the one deterministic (`--no-shuffle`)
    # mutant list after the diff filter, so the four shards together cover it
    # exactly once — the scheduled full sweep (scheduled.yml) shards the same
    # way, eight-wide. Each shard pays its own baseline build and test. The
    # timeout is a wedge guard: a stuck shard fails visibly and the other three
    # still report.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Compiled from source with --locked for reproducibility; the rust-cache step
      # caches the installed binary between runs.
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Compute PR diff
        # Through the environment, not interpolated into the script: the
        # trigger's branch filter limits base_ref to `main` today, but a value
        # spliced into shell source is only as safe as every future filter.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}..." > pr.diff
      - name: Run mutants on changed code (this shard)
        # `-- --all-features` is load-bearing: without it, feature-gated code
        # (the everything-server's `tap`) is never compiled into the mutated
        # build, so its mutants "pass" in zero seconds without a single test
        # running — 45 such phantom misses on PR #8 exposed this.
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo mutants --workspace --no-shuffle --in-diff pr.diff --shard "${SHARD}/4" -- --all-features
      - name: Upload this shard's outcomes
        # The missed, caught and timeout lists: what a red shard is read from.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-pr-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14

  incremental:
    # The one check that reports the gate, under the name it had before it was
    # sharded, so a branch-protection rule naming "Mutants (PR diff)" keeps
    # working. It passes only when every shard passed; a skipped or cancelled
    # shard fails it, as a failed one does.
    name: Mutants (PR diff)
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.shards.result }}
        run: |
          echo "shards: ${SHARDS}"
          [[ "${SHARDS}" == "success" ]]
