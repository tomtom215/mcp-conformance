# mdBook configuration. The book is a curated reader's guide; the planning
# documents under docs/plan/ remain the single source of truth (the chapters
# link to them, and three chapters embed canonical files verbatim with
# {{#include}} so the book cannot drift from them: corpus.md embeds
# corpus/README.md, and getting-started.md and trace-format.md the README's
# worked example). `mdbook build book` is a
# CI gate (.github/workflows/ci.yml): a missing include file or anchor fails
# the build.

[book]
title = "MCP Conformance Toolkit"
authors = ["Tom F."]
description = "Check a Model Context Protocol (MCP) server against the specification, clause by clause: one command, or record any session and judge it offline. Revisions 2025-11-25 and 2026-07-28."
src = "src"
language = "en"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/tomtom215/mcp-conformance"
# No edit-url-template: a wrong template silently links every page to a 404,
# and the repository link above already routes a reader to the source.
