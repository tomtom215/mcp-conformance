[package]
name = "mcp-conformance-cli"
description = "Run the official Model Context Protocol conformance suite through a recording tap and judge the same traffic clause by clause; and a local workbench over a library of recordings"
readme = "README.md"
documentation = "https://docs.rs/mcp-conformance-cli"
keywords = ["mcp", "conformance", "testing", "protocol", "validator"]
categories = ["development-tools::testing", "command-line-utilities"]
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Not published yet: the first release that carries it needs the one-time token
# bootstrap RELEASING.md describes. The crate is `mcp-conformance-cli`, not the bare
# `mcp-conformance`, which ADR-0003 leaves to rust-sdk (ADR-0021, "The crate's name").
publish = false

[features]
# The library is the agreement policy and the suite pin, which `cargo xtask
# conformance` shares, and `watch`'s live judge and OTLP encoding: serde-family
# and the validator only. The binary — the recorder, the stdio bridge, the
# process orchestration, the span export and the CLI — needs the rest
# (docs/plan/decisions/0005-cli-argument-parsing.md, 0021).
default = ["cli"]
cli = [
    "dep:clap",
    "dep:tokio",
    "dep:axum",
    "dep:futures",
    "dep:mcp-trace-capture",
    "dep:ring",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
mcp-conformance-core = { workspace = true }
mcp-trace-validator = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true, optional = true }
# The recorder, in process: the HTTP proxy for `--url` and for a client under
# test, the stdio relay behind the bridge for `--command`. `tls` for `https://`
# servers.
mcp-trace-capture = { workspace = true, features = ["tls"], optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time"] }
# The stdio bridge's HTTP listener. Already in the tree for the recorder and
# the everything server.
axum = { workspace = true, optional = true }
# The bridge's event streams (`Body::from_stream`). Already a direct
# dependency of the recorder.
futures = { version = ">=0.3.30, <0.4", optional = true }
# `watch --otlp`'s trace and span ids and the workbench's per-launch secrets come
# from the OS CSPRNG (`ring::rand::SystemRandom`); the workbench also keys its
# verdict cache by each trace's SHA-256 from `ring`. Already in the tree, at this
# version, as the recorder's TLS provider (rustls's `ring` backend under
# mcp-trace-capture's `tls`, which this crate enables), so no new crate; no
# default features.
ring = { version = ">=0.17.14, <0.18", default-features = false, optional = true }

[dev-dependencies]
# The bridge's tests drive it over loopback; plain HTTP, no TLS features.
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# What a live judging pass costs `watch` (benches/live.rs); measures, never gates.
criterion = { workspace = true }

[[bench]]
name = "live"
harness = false

[[bin]]
name = "mcp-conformance"
path = "src/main.rs"
required-features = ["cli"]

[lints]
workspace = true
