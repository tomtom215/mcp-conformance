[package]
name = "mcp-trace-validator"
description = "Deterministic offline validator for recorded Model Context Protocol traces: requirement-level findings, machine-readable reports"
readme = "README.md"
keywords = ["mcp", "conformance", "validator", "testing", "protocol"]
categories = ["development-tools::testing", "command-line-utilities"]
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# The library engine has no CLI dependencies; the binary needs clap. Library
# consumers can use `default-features = false` to drop it
# (docs/plan/decisions/0005-cli-argument-parsing.md).
default = ["cli"]
cli = ["dep:clap"]

# Deprecated no-op, kept so manifests that enabled it keep building. Until 0.6.0
# it gated the `2026-07-28` registry and checks; every build now ships them.
draft-2026-07-28 = []

# docs.rs builds with every feature enabled so feature-gated APIs are documented.
# `cargo binstall mcp-trace-validator` downloads the attested prebuilt archive the release
# workflow attaches (both CLIs per target; Linux is static musl) instead of
# compiling. binstall falls back to building from source where no archive fits.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mcp-conformance-v{ version }-{ target }.tar.gz"
bin-dir = "mcp-conformance-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/mcp-conformance-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
mcp-conformance-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true, optional = true }

[dev-dependencies]
# Checks the published trace-event JSON Schema against the reader
# (tests/trace_schema.rs). No default features: no remote `$ref` resolution.
jsonschema = { version = ">=0.57, <0.58", default-features = false }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "validate"
harness = false

[[bin]]
name = "mcp-trace-validator"
path = "src/main.rs"
required-features = ["cli"]

[lints]
workspace = true
