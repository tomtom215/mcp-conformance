[package]
name = "mcp-conformance-core"
description = "Model Context Protocol conformance model: requirement registry, trace schema, message classification, and canonical JSON"
readme = "README.md"
documentation = "https://docs.rs/mcp-conformance-core"
keywords = ["mcp", "conformance", "protocol", "specification", "testing"]
categories = ["development-tools::testing", "data-structures"]
edition.workspace = true
rust-version.workspace = true
version.workspace = true
# MIT for this crate's own code; Apache-2.0 for the protocol's JSON Schemas
# vendored from the specification in spec-schema/ (its README and LICENSE).
license = "MIT AND Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# The draft tracking skeleton is xtask data about an unreleased revision: no
# build reads it (the registry embeds an explicit file list), so it does not ship.
exclude = ["registry/draft"]

[features]
# Deprecated no-op, kept so manifests that enabled it keep building. Until 0.6.0
# it gated the `2026-07-28` registry; that revision is published and its
# registry is complete, so every build now ships it.
draft-2026-07-28 = []

# docs.rs builds with every feature enabled so feature-gated APIs are documented.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "canonical"
harness = false

[lints]
workspace = true
