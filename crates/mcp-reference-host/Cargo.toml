[package]
name = "mcp-reference-host"
description = "Reference MCP host: scriptable client handlers, a bounded deterministic agent loop, real transports, trace capture, and the official suite's client scenarios as SUT"
readme = "README.md"
documentation = "https://docs.rs/mcp-reference-host"
keywords = ["mcp", "conformance", "host", "client", "testing"]
categories = ["development-tools::testing"]
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# docs.rs builds with every feature enabled so feature-gated APIs are documented.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[features]
# The binary by default, as ADR-0005 sets for every crate here that ships one
# (validator, everything-server, capture): `cargo install mcp-reference-host`
# must install it. With `default = []` that command built nothing — the bin's
# `required-features = ["cli"]` was never met. Library consumers (the handlers,
# the agent loop) use `default-features = false`, which drops clap, the child-
# process transport and the reqwest stack; CI lints and tests that mode.
default = ["cli"]
# Child-process transport: the host spawns a stdio server (`--server-cmd`).
proc = ["rmcp/transport-child-process", "tokio/process"]
# Streamable HTTP transport plus the SSE-resumption client (`resume`), which
# drives rmcp's public `StreamableHttpClient` seam directly — its only
# shipped implementation is `reqwest::Client`, and the seam's own vocabulary
# is `sse_stream::Sse` frames in `futures` streams, hence the three direct
# dependencies (ADR-0009 §Amendment; all already in the tree as rmcp's own).
http = [
    "rmcp/transport-streamable-http-client-reqwest",
    "dep:reqwest",
    "dep:futures",
    "dep:sse-stream",
]
# The binary: scenario dispatch for the pinned official suite's client
# scenarios (URL appended as the final argument) plus a general
# `--server-cmd`/positional-URL mode.
cli = ["proc", "http", "dep:clap", "tokio/rt-multi-thread"]
# OAuth for the official suite's `auth/*` client scenarios: with `cli`, the
# binary's `--oauth-conformance`. NOT in `default` or `cli`: it is a conformance
# harness mode (`src/oauth.rs` says why it is not a way to sign in), and rmcp's
# `auth` feature brings `oauth2` 5.0, whose older `rand`/`sha2`/`thiserror`/
# `base64` lines sit beside the tree's current ones (deny.toml lists each) — a
# cost `cargo install mcp-reference-host` should not pay for a flag only this
# repository's gate passes. The wrapper sits on the same `StreamableHttpClient`
# seam `resume` uses, whose signatures name `http::HeaderName`/`HeaderValue`.
oauth = ["http", "rmcp/auth", "dep:http", "dep:thiserror-v1"]

[[bin]]
name = "mcp-reference-host"
required-features = ["cli"]

[dependencies]
# The host is an rmcp client (ADR-0009): handlers, the client role, and the
# in-process duplex transport the tests drive. Network transports (child
# process, streamable HTTP) live behind the `proc`/`http` features.
rmcp = { workspace = true, features = ["client", "transport-io", "elicitation"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util = { workspace = true }
clap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
# The `StreamableHttpClient` seam's stream/frame vocabulary (feature `http`):
# `get_stream` yields `futures::stream::BoxStream<Result<sse_stream::Sse, …>>`,
# and the resumption dance reads `retry`/`id`/`data` off those frames. Floors
# are the minimal-versions minimums the tree actually resolves to: futures 0.3.30
# (rmcp's `process-wrap` requires `^0.3.30`; 0.3.0 is yanked), sse-stream 0.2.4
# (rmcp 3.1.2 requires `^0.2.4`; `>=0.2` selected 0.2.0 and could not resolve
# against it — found by the weekly gate on 2026-08-24, which is what that gate
# is for: a floor goes dishonest when an upstream manifest moves, with no local
# change to notice). Both crates are already in the tree as rmcp dependencies.
# `cargo xtask minimal-versions` keeps these honest.
futures = { version = ">=0.3.30, <0.4", optional = true }
sse-stream = { version = ">=0.2.4, <0.3", optional = true }
# Feature `oauth`: the `StreamableHttpClient` trait's header-map types. Already
# in the tree (reqwest's and rmcp's own); floor 1.1 is reqwest's `http ^1.1`.
http = { version = ">=1.1, <2", optional = true }
# Minimal-versions floor shim for feature `oauth`: oauth2 5.0.0 declares
# thiserror "1.0" and does not compile against 1.0.0 (unresolved import and a
# missing `as_display`; reproduced 2026-11-20 by pinning the lock to 1.0.0,
# and it builds at 1.0.69). Its only job is the floor; remove it when oauth2
# states one.
thiserror-v1 = { package = "thiserror", version = ">=1.0.69, <2", optional = true }

[dev-dependencies]
mcp-everything-server = { workspace = true }
# Captured traces are pinned against the validator's real reader and judged
# by the real engine over the builtin registry: a capture that drifts from
# the trace schema must fail here, not at agreement time.
mcp-conformance-core = { workspace = true }
mcp-trace-validator = { workspace = true }
# The scripted `StreamableHttpClient` fakes in `resume::tests` implement the
# rmcp trait, whose signatures name `http::HeaderName`/`HeaderValue`.
# Floor 1.1: `reqwest` (the streamable-HTTP client) requires `http ^1.1`.
http = ">=1.1, <2"
proptest = { workspace = true }
# The probe server in tests/server_initiated.rs drives the host's handlers
# through real wire dispatch (roots/list, URL elicitation, completion
# notifications) — the only way to invoke the ClientHandler trait methods.
rmcp = { workspace = true, features = ["server"] }
# test-util: paused-time tests pin the resumption dance's deadline arithmetic
# (a deadline accidentally in the past is invisible to instant-ready fakes).
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "net", "test-util"] }
# tests/transports.rs serves the real everything-server app on a loopback
# socket (axum::serve) so the host's reqwest-backed transport is exercised
# against a real wire — no npx, no network beyond loopback.
axum = { workspace = true }

[lints]
workspace = true
