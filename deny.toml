#
# cargo-deny configuration — license allowlist, advisory policy, source policy.
# Run: cargo deny check

[graph]
all-features = true

# ---------------------------------------------------------------------------
# Advisories: any RustSec advisory fails the build. The ecosystem lesson is
# CVE-2026-42559, which shipped without a RustSec entry — we treat the
# advisory DB as a hard gate precisely because gaps in it are invisible.
# ---------------------------------------------------------------------------
[advisories]
version = 2
yanked = "deny"

# ---------------------------------------------------------------------------
# License policy: permissive-only, high detection confidence.
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    # MIT No Attribution: MIT without the notice-retention condition, so strictly
    # more permissive. Entered 2026-10-13 for borrow-or-share (via jsonschema's
    # `referencing`, ADR-0020).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# ---------------------------------------------------------------------------
# Bans: a new duplicate major version fails the build — every accepted one is
# below, version-pinned with its root named, so it re-fires on any drift and
# cargo-deny warns when the skip goes unused (the duplicate collapsed).
# Wildcard requirements are an error (they defeat the upper-bound policy).
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # The proc-macro ecosystem is mid-migration from syn 2 to syn 3, so a build
    # that uses both derive-heavy and platform crates gets one of each. Verified
    # from Cargo.lock on 2026-07-26 — syn 3.0.3 is named by the crates that moved
    # fast (serde_derive 1.0.229, clap_derive 4.6.4, async-trait 0.1.91,
    # thiserror-impl 2.0.19, ref-cast-impl 1.0.26), syn 2.0.119 by the seventeen
    # that have not (darling, schemars_derive, rmcp-macros, tokio-macros,
    # tracing-attributes, futures-macro, the windows-* and zerocopy/yoke/zerovec
    # families, …). Nothing here is ours to fix and nothing ships in a binary:
    # both are build-time-only proc-macro dependencies, so the cost is compile
    # time, not surface area. Pinning our own derive crates backwards to force
    # agreement would trade a real dependency upgrade for a cosmetic graph.
    # Collapses on its own as the syn-2 holdouts migrate; re-fires if either
    # version moves, because the pin is exact.
    { crate = "syn@2.0.119", reason = "ecosystem mid-migration to syn 3: build-time proc-macro dependency of both the moved and unmoved derive crates" },
    # Introduced 2026-09-25 by mcp-trace-capture's `tls` feature: rustls's `ring`
    # provider (ring 0.17.14) still requires getrandom 0.2 and windows-sys 0.52,
    # where the rest of the graph has moved to getrandom 0.4 (rmcp) and
    # windows-sys 0.61. Runtime dependencies, but of one binary only, and only in
    # its TLS build. The alternatives cost more: rustls's other provider,
    # aws-lc-rs, carries licences outside the allowlist above and needs a C
    # toolchain to build; dropping HTTPS would leave the capture tool unable to
    # record a remote server. Collapses when ring moves; the pins are exact.
    { crate = "getrandom@0.2.17", reason = "ring 0.17 (mcp-trace-capture's TLS provider) still requires getrandom 0.2" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 (mcp-trace-capture's TLS provider) still requires windows-sys 0.52" },
    # Introduced 2026-10-13 by the validator's JSON Schema engine (ADR-0020):
    # jsonschema 0.58 takes ahash 0.8 with its default features, whose
    # `runtime-rng` requires getrandom 0.3 (and, on UEFI targets only, r-efi 5),
    # where proptest and rmcp have moved to getrandom 0.4. Not switchable from
    # this workspace: Cargo features are additive and the request is jsonschema's.
    # A runtime dependency of mcp-trace-validator; the random hash seeds it
    # supplies never reach a report, whose schema findings are sorted. Collapses
    # when ahash or jsonschema moves; the pins are exact.
    { crate = "getrandom@0.3.4", reason = "ahash 0.8 (jsonschema's, default features) requires getrandom 0.3" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3's UEFI backend, alongside getrandom 0.4's r-efi 6" },
    # Removed 2026-07-26: the wit-bindgen 0.51/0.57 split (rmcp's getrandom 0.4
    # vs proptest's dev-only getrandom 0.3) has collapsed — the lock now carries
    # only 0.57.1, so cargo-deny's unmatched-skip warning correctly retired it.
    # Kept as a note rather than silently deleted: a skip that disappears without
    # explanation reads like someone loosened the policy.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
