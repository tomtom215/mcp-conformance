#
# cargo-deny configuration — license allowlist, advisory policy, source policy.
# Run: cargo deny check

[graph]
all-features = true

# ---------------------------------------------------------------------------
# Advisories: any RustSec advisory fails the build. The ecosystem lesson is
# CVE-2026-42559, which shipped without a RustSec entry — we treat the
# advisory DB as a hard gate precisely because gaps in it are invisible.
# ---------------------------------------------------------------------------
[advisories]
version = 2
yanked = "deny"

# ---------------------------------------------------------------------------
# License policy: permissive-only, high detection confidence.
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# ---------------------------------------------------------------------------
# Bans: a new duplicate major version fails the build — every accepted one is
# below, version-pinned with its root named, so it re-fires on any drift and
# cargo-deny warns when the skip goes unused (the duplicate collapsed).
# Wildcard requirements are an error (they defeat the upper-bound policy).
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # The proc-macro ecosystem is mid-migration from syn 2 to syn 3, so a build
    # that uses both derive-heavy and platform crates gets one of each. Verified
    # from Cargo.lock on 2026-07-26 — syn 3.0.3 is named by the crates that moved
    # fast (serde_derive 1.0.229, clap_derive 4.6.4, async-trait 0.1.91,
    # thiserror-impl 2.0.19, ref-cast-impl 1.0.26), syn 2.0.119 by the seventeen
    # that have not (darling, schemars_derive, rmcp-macros, tokio-macros,
    # tracing-attributes, futures-macro, the windows-* and zerocopy/yoke/zerovec
    # families, …). Nothing here is ours to fix and nothing ships in a binary:
    # both are build-time-only proc-macro dependencies, so the cost is compile
    # time, not surface area. Pinning our own derive crates backwards to force
    # agreement would trade a real dependency upgrade for a cosmetic graph.
    # Collapses on its own as the syn-2 holdouts migrate; re-fires if either
    # version moves, because the pin is exact.
    { crate = "syn@2.0.119", reason = "ecosystem mid-migration to syn 3: build-time proc-macro dependency of both the moved and unmoved derive crates" },
    # Removed 2026-07-26: the wit-bindgen 0.51/0.57 split (rmcp's getrandom 0.4
    # vs proptest's dev-only getrandom 0.3) has collapsed — the lock now carries
    # only 0.57.1, so cargo-deny's unmatched-skip warning correctly retired it.
    # Kept as a note rather than silently deleted: a skip that disappears without
    # explanation reads like someone loosened the policy.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
